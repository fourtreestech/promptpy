[project]
name = "promptpy"
version = "0.3.0"
description = "A Python command line input and validation library"
readme = "README.md"
authors = [
    { name = "Neil Martin", email = "neil@fourtrees.tech" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
]
license = "MIT"
keywords = ["prompt", "cli", "command line interface"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/fourtreestech/promptpy"
Documentation = "https://promptpy.readthedocs.io/"

[tool.bumpver]
current_version = "0.3.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"README.md" = [
    'version-{version}-blue',
]
"src/promptpy/__init__.py" = [
    '__version__ = "{version}"'
]
"docs/source/conf.py" = [
    'release = "{version}"'
]

[tool.cov-badge]
percent_path = ["totals", "percent_covered_display"]

[tool.hatch.version]
path = "src/promptpy/__init__.py"

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src"]

[tool.ruff.lint]
select = ["F", "I", "B", "C4", "SIM", "RUF", "D", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"docs/*" = ["D"]

[tool.tox]
requires = ["tox>=4.24", "tox-uv"]
env_list = ["3.14", "3.13", "3.12", "lowest"]

[tool.tox.env_run_base]
description = "Run tests under {base_python}"
runner = "uv-venv-lock-runner"
package = "editable"
dependency_groups = ["test"]
commands = [["pytest"]]

[tool.tox.env.lowest]
runner = "uv-venv-runner"
base_python = ["python3.12"]
uv_resolution = "lowest-direct"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "cov-badge>=0.1.1",
    "pytest-cov>=6.0.0",
    "tox>=4.24.2",
    "tox-uv>=1.37.0",
]
test = [
    "pytest>=8.3.5",
    "pytest-randomly>=3.16.0",
]
docs = [
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=3.1.0",
]
